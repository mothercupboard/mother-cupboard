service: mother-cupboard-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-2
  stage: ${opt:stage, 'development'}
  environment:
    STAGE: ${self:provider.stage}
    SENTRY_DSN: ${env:SENTRY_DSN, ''}
    AI_PROVIDER: ${env:AI_PROVIDER, 'anthropic'}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}

functions:
  suggestMeals:
    handler: functions/suggest-meals/handler.handler
    timeout: 30
    events:
      - http:
          path: /suggest-meals
          method: post
          cors: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - '@aws-sdk/*'
    plugins: esbuild-plugins.js
  dotenv:
    path: .env
    include:
      - AI_PROVIDER
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - SENTRY_DSN

