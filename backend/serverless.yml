service: mother-cupboard-backend

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-west-2
  stage: ${opt:stage, 'development'}
  environment:
    STAGE: ${self:provider.stage}
    SENTRY_DSN: ${env:SENTRY_DSN, ''}
    AI_PROVIDER: ${env:AI_PROVIDER, 'anthropic'}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    SUPABASE_URL: ${env:SUPABASE_URL, ''}
    SUPABASE_SERVICE_ROLE_KEY: ${env:SUPABASE_SERVICE_ROLE_KEY, ''}
    SCRAPERAPI_KEY: ${env:SCRAPERAPI_KEY, ''}
    # Residential proxy (pay-per-GB). When PROXY_HOST is set these take
    # precedence over SCRAPERAPI_KEY — see functions/fetch-offers/proxy.ts.
    # The two *_FLAG vars only need setting if the provider's username
    # syntax differs from the DataImpulse-style default.
    PROXY_HOST: ${env:PROXY_HOST, ''}
    PROXY_PORT: ${env:PROXY_PORT, ''}
    PROXY_USERNAME: ${env:PROXY_USERNAME, ''}
    PROXY_PASSWORD: ${env:PROXY_PASSWORD, ''}
    PROXY_COUNTRY_FLAG: ${env:PROXY_COUNTRY_FLAG, ''}
    PROXY_SESSION_FLAG: ${env:PROXY_SESSION_FLAG, ''}

functions:
  suggestMeals:
    handler: functions/suggest-meals/handler.handler
    timeout: 30
    events:
      - http:
          path: /suggest-meals
          method: post
          cors: true

  # Saver Cupboard: weekly supermarket offers fetch (Monday 05:00 UTC).
  fetchOffers:
    handler: functions/fetch-offers/handler.handler
    # 15 min (Lambda's maximum) — the fetch is ~2½ min and the mapping pass
    # scales with the number of retailers; headroom is free (billed per ms).
    timeout: 900
    memorySize: 512
    events:
      # Runs on the preview (production) stage only — see custom.cronEnabled.
      - schedule:
          rate: cron(0 5 ? * MON *)
          enabled: ${self:custom.cronEnabled.${self:provider.stage}, false}

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    external:
      - '@aws-sdk/*'
    plugins: esbuild-plugins.js
  dotenv:
    path: .env
    include:
      - AI_PROVIDER
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - SENTRY_DSN
      - SUPABASE_URL
      - SUPABASE_SERVICE_ROLE_KEY
      - SCRAPERAPI_KEY
      - PROXY_HOST
      - PROXY_PORT
      - PROXY_USERNAME
      - PROXY_PASSWORD
      - PROXY_COUNTRY_FLAG
      - PROXY_SESSION_FLAG
  # Weekly offers cron fires on preview (production) only. Both stages
  # share one Supabase offers table, so running it on development too just
  # duplicates the work and doubles ScraperAPI credit spend.
  cronEnabled:
    preview: true
    development: false
