<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email confirmed · Mother Cupboard</title>
  <style>
    :root {
      --primary: #D4673A;
      --primary-dark: #A84E28;
      --bg: #FAF6F0;
      --surface: #FFFFFF;
      --text: #2C2420;
      --text-secondary: #6E635C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(212, 103, 58, 0.12);
    }
    .badge {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #E8F5E9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .badge svg { width: 40px; height: 40px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    p { color: var(--text-secondary); font-size: 16px; line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 14px;
      transition: background 0.15s ease;
    }
    .btn:active { background: var(--primary-dark); }
    .hint { margin-top: 18px; font-size: 13px; color: var(--text-secondary); }
    .brand { margin-top: 28px; font-size: 13px; color: var(--text-secondary); font-weight: 700; letter-spacing: 0.3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6L9 17l-5-5" stroke="#3A7D44" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Email confirmed</h1>
      <p>You&rsquo;re all set. Head back to Mother Cupboard and sign in with your email and password.</p>
      <a class="btn" id="openApp" href="mothercupboard://">Open Mother Cupboard</a>
      <div class="hint">If the button doesn&rsquo;t open the app, just switch to Mother Cupboard yourself and sign in.</div>
      <div class="brand">Mother Cupboard</div>
    </div>
  </div>
  <script>
    // Give the browser a moment, then try to bounce straight into the app.
    setTimeout(function () {
      try { window.location.href = 'mothercupboard://'; } catch (e) {}
    }, 800);
  </script>
</body>
</html>
